<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="compose.css" />
    <title>简洁撰写器</title>
  </head>
  <body>
    <header class="cn-head">
      <span class="cn-badge">compose-view 插件</span>
      <span class="cn-subject" id="subject">（未填写主题）</span>
    </header>
    <div class="cn-recipients" id="recipients">收件人：—</div>
    <pre class="cn-body" id="body">（空正文）</pre>
    <footer class="cn-foot">
      <button type="button" id="append">追加一句话</button>
      <button type="button" id="sign">插入署名</button>
      <span class="cn-hint" id="hint"></span>
    </footer>
    <script src="compose.js"></script>
  </body>
</html>
